name: Daily Exchange Email

on:
  schedule:
    # Weekdays at ~10:23 BRT (13:23 UTC), after BACEN's first bulletin (~10:05).
    # Off the top of the hour to reduce GitHub's scheduling delays, which can
    # still be hours; the report uses whatever quote is latest when it runs.
    - cron: "23 13 * * 1-5"
  workflow_dispatch:

# Needed to commit the forecast log back to main.
permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send exchange report
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EXCHANGE_PERCENTILE_THRESHOLD: ${{ secrets.EXCHANGE_PERCENTILE_THRESHOLD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SALARY_USD: ${{ secrets.SALARY_USD }}
        run: python -m src.main

      - name: Save forecast log
        # Lets the next runs score the AI's outlooks against what really happened.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/forecasts.json ] || exit 0
          git add data/forecasts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record daily forecast [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
